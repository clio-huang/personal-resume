<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0d1712" />
  <title>Clio Huang - 个人作品集</title>
  <meta name="description" content="Clio Huang 的影像、现场与城市传播作品集" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Noto+Sans+SC:wght@400;500;700;800&family=Noto+Serif+SC:wght@600;700;900&display=swap">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Noto+Sans+SC:wght@400;500;700;800&family=Noto+Serif+SC:wght@600;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#home" aria-label="回到顶部" data-site-name>Clio Huang</a>

      <button class="nav-toggle" aria-label="菜单" aria-expanded="false">
        <span class="hamburger"></span>
      </button>

      <nav class="nav" id="main-nav">
        <a href="#about" class="nav-link">关于</a>
        <a href="#skills" class="nav-link">技能</a>
        <a href="#experience" class="nav-link">经历</a>
        <a href="#education" class="nav-link">教育</a>
        <a href="#projects" class="nav-link">项目</a>
        <a href="#more" class="nav-link">荣誉</a>
        <a href="#contact" class="nav-link">联系方式</a>
      </nav>
      <button class="theme-toggle" type="button" aria-label="切换主题" aria-pressed="false">
        <span aria-hidden="true">☼</span>
      </button>
    </div>
  </header>

  <main>
    <!-- Hero -->
    <section id="home" class="hero section">
      <div class="container hero-shell">
        <div class="hero-intro reveal-up" id="hero-content">
          <p class="hero-kicker">Content / Story / Urban Culture</p>
          <h1 class="hero-title">
            <span class="accent" data-site-name>Clio Huang</span>
          </h1>
          <p class="lead reveal-up delay-1" data-site-tagline></p>
          <div class="scroll-cue reveal-up delay-2" aria-label="向下滚动">
            <span>Scroll</span>
            <span class="scroll-arrow">↓</span>
          </div>
        </div>
      </div>

      <!-- Wave separator -->
      <div class="wave-sep" aria-hidden="true">
        <svg viewBox="0 0 1200 120" preserveAspectRatio="none">
          <defs>
            <linearGradient id="heroWaveFill" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#eef3ee" stop-opacity="0.98" />
              <stop offset="50%" stop-color="#e7e0d6" stop-opacity="0.92" />
              <stop offset="100%" stop-color="#f6f2eb" stop-opacity="0.98" />
            </linearGradient>
          </defs>
          <path d="M0,0 C150,100 350,100 600,50 C850,0 1050,0 1200,80 L1200,120 L0,120 Z" fill="url(#heroWaveFill)"></path>
        </svg>
      </div>
    </section>

    <!-- Directory -->
    <section class="section reveal-section">
      <div class="container">
        <div class="directory-wrap reveal-up">
          <div class="directory-label">猜你想了解</div>
          <div class="directory-card">
            <div class="directory-grid">
              <a href="#about">个人信息</a>
              <a href="#skills">技能特长</a>
              <a href="#experience">工作经历</a>
              <a href="#education">教育背景</a>
              <a href="#projects">项目展示</a>
              <a href="#contact">联系方式</a>
              <a href="#more">课外活动</a>
              <a href="#more">奖项与荣誉</a>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- About -->
    <section id="about" class="section reveal-section">
      <div class="container">
        <h2 class="section-title">个人信息</h2>
        <div class="about-grid" data-about></div>
      </div>
    </section>

    <!-- Skills -->
    <section id="skills" class="section invert reveal-section">
      <div class="container">
        <h2 class="section-title">技能特长</h2>

        <div class="skills-grid" data-skills>
          <!-- 内容由 content.js 渲染 -->
        </div>
      </div>

      <div class="wave-sep flip">
        <svg viewBox="0 0 1200 120" preserveAspectRatio="none">
          <path d="M0,20 C150,100 350,100 600,50 C850,0 1050,0 1200,80 L1200,120 L0,120 Z" fill="currentColor"></path>
        </svg>
      </div>
    </section>

    <!-- Experience -->
    <section id="experience" class="section reveal-section">
      <div class="container">
        <h2 class="section-title">工作经历</h2>
        <div class="timeline reveal-up" data-experience></div>
      </div>
    </section>

    <!-- Education -->
    <section id="education" class="section invert reveal-section">
      <div class="container">
        <h2 class="section-title">教育背景</h2>
        <div class="education-grid" data-education></div>
      </div>
    </section>

    <!-- Projects -->
    <section id="projects" class="section invert reveal-section">
      <div class="container">
        <h2 class="section-title">项目展示</h2>

        <div class="project-filters" data-project-filters aria-label="项目筛选"></div>
        <div class="projects-grid" data-projects></div>
      </div>

      <!-- Project Modal -->
      <div id="project-modal" class="modal" aria-hidden="true" role="dialog" aria-modal="true">
        <div class="modal-card">
          <button class="modal-close" aria-label="关闭">&times;</button>
          <h3 id="modal-title"></h3>
          <p id="modal-desc" class="muted"></p>
          <div id="modal-tags" class="tag-list"></div>
          <div class="modal-actions">
            <a id="modal-link" class="btn primary" href="#" target="_blank" rel="noopener">查看项目</a>
          </div>
        </div>
      </div>
    </section>

    <!-- Contact -->
    <section id="contact" class="section reveal-section">
      <div class="container">
        <h2 class="section-title">联系方式</h2>

        <div class="contact-grid">
          <div class="contact-card reveal-up">
            <h3>说点什么？</h3>
            <p class="muted">欢迎通过邮箱或下面的表单联系我。</p>

            <form id="contact-form" class="contact-form" action="#" onsubmit="return false">
              <label>
                <span>姓名</span>
                <input type="text" name="name" required>
              </label>
              <label>
                <span>邮箱</span>
                <input type="email" name="email" required>
              </label>
              <label>
                <span>信息</span>
                <textarea name="message" rows="4" required></textarea>
              </label>
              <div class="form-actions">
                <button class="btn primary" type="submit">发送</button>
                <button class="btn outline" type="reset">重置</button>
              </div>
              <p class="note muted small">（此示例表单为前端示例；接入后端或使用第三方表单服务进行实际提交）</p>
            </form>
          </div>

          <div class="contact-info reveal-up delay-1">
            <h3>直接联系</h3>
            <ul class="contact-list" data-direct-contact></ul>
          </div>
        </div>
      </div>
    </section>

    <!-- More -->
    <section id="more" class="section invert reveal-section">
      <div class="container more-grid">
        <div>
          <h2 class="section-title">课外活动</h2>
          <div class="activity-list" data-activities></div>
        </div>
        <div>
          <h2 class="section-title">奖项与荣誉</h2>
          <ul class="award-list" data-awards></ul>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <small>© <span id="year"></span> Clio Huang · 设计 / 开发</small>
    </div>
  </footer>

  <script src="content.js" defer></script>
  <script src="script.js" defer></script>
</body>
</html>
